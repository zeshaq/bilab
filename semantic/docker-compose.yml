name: bilab-semantic

# bilab Phase 3: the semantic layer (Cube) on the lab's Trino/Iceberg, with
# per-user governance. Queries run AS THE PERSON (the backend verifies their
# Keycloak token and passes it through), so the lab's OPA masking/RLS applies.
# Cube publishes no host port in production; Phase 3 keeps a loopback port for
# tests, the backend is the only caller.

services:
  cube:
    image: cubejs/cube:v1.8.31
    container_name: bilab-cube
    hostname: bilab-cube
    restart: unless-stopped
    environment:
      CUBEJS_DB_TYPE: trino
      CUBEJS_DEV_MODE: "false"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_TELEMETRY: "false"
      CUBEJS_LOG_LEVEL: warn
      CUBEJS_SCHEMA_PATH: model
      CUBEJS_CUBESTORE_HOST: cubestore
    volumes:
      - ./cube.js:/cube/conf/cube.js:ro
      - ./model:/cube/conf/model:ro
      - ./tls/trino.crt:/certs/trino.crt:ro
    ports:
      - "127.0.0.1:4199:4000"
    mem_limit: 3g
    networks: [datalab-net]

  cubestore:
    image: cubejs/cubestore:v1.8.31
    container_name: bilab-cubestore
    hostname: cubestore
    restart: unless-stopped
    environment:
      CUBESTORE_LOG_LEVEL: warn
    volumes:
      - cubestore-data:/cube/data
    mem_limit: 2g
    networks: [datalab-net]

volumes:
  cubestore-data:

networks:
  datalab-net:
    external: true
    name: datalab-net
